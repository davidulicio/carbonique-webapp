% Second stage ini_file for UQAM_1
%
% May, 2024 Zoran Nesic
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% Revisions:
%
% 23 September 2026 (Rosie)
%   - Removing WTD trace. From David, 23 Sept 2026: we do not have a WTD sensor neither an EasyProbe, 
%     we have tried many times but the clay goes inside the sensors and destroys them
%     so we will not be installing them in there.
%
% June 12, 2026 (Rosie)
%	- Added back in gap-filling for RH_1_1_1 and RH_1_2_1, fair quality (all metrics >0.8) 
%
% June 11, 2026 (Rosie)
%	- Added TS_ averaged measurements (5 horizontal replicas at 8 cm depth)
%	- Added all SWC traces (can horizontal replicas be averaged like for TS?)
%
% May 11, 2026 Karolina
%   -  Edited gap filled variables to have correct Ameriflux formatting (e.g. TA_F_1_1_1 instead of TA_1_1_1_F). 
%   -  See bottom of webpage: https://ameriflux.lbl.gov/data/aboutdata/data-variables/
%
% November 24, 2025 Umair
% 
% 	- Changed notation to be "Ameriflux-friendly": provide both non-gap-filled and gap-filled variables for AMF, 
% 	  as well as gap-filled '_F' for internal/data sharing.
%	- Switched height order for TA and RH, since Ameriflux requires upper-most air measurements to be e.g. TA_1_1_1, 
%     then second highest TA_1_2_1, etc. These were the wrong way round in earlier versions of the file. 
% March 23, 2026 Umair
% 	- RH from ECCC is not a good fit so we removed the RH_1_1_1_F and RH_1_2_1_F traces.
% 	- Only 0.14 % is missing from RH_1_1_1 and RH_1_2_1 for 2025, so we might not need _F variables for RH.
%   - G_1: Check with David to confirm about taking average for four G_*_*_* variables at different horizontal locations. 
%     And are they at same vertical depth? and which depth are they?
%   - For P_RAIN_1_1_1 and P_ECCC, the variables are different and we can't use P_ECCC for gapfilling P_RAIN_1_1_1. 
%     So, I removed the P_RAIN_1_1_1_F trace.
%   - For (WS_1_1_1, WD_1_1_1) and (WS_ECCC, WD_ECCC), the variables are different and we can't use *_ECCC for gapfilling WS/WD_1_1_1. 
%     So, I comment out the WS/WD_1_1_1_F trace. There is no missing data for both these variables for 2025 and it can be tested with ERA-5 
%     later, if needed.
%   - @Rosie: Please review the wind_speed and wind_dir from Flux. 
%   - Wind direction filtering (badWD) moved to third stage (this happened some time ago).
%
% October, 2024 David Trejo





Site_name = 'UQAM_1'
SiteID = 'UQAM_1'
input_path    = ''
output_path   = '' 
high_level_path = {}
searchPath = 'auto'
 
% Contents:
% Misc. variables
% Profiles
% Radiation
% Soil
% Turbulent fluxes
% Carbon balance terms
% Energy storage terms

[Trace]
	variableName 	= 'all_nan'
	Evaluate 		= 'all_nan = nan(size(clean_tv));
                		processingYear = yearIn;'
	title 			= 'definitions of a all_nan trace and some global variables'
	units 			= ''
[End]

% ----------------------------------------------------------------------------
% Misc. important variables - temperature, pressure etc.
% ----------------------------------------------------------------------------

% pass through unfilled variables for Ameriflux
% non-gap-filled TA
[Trace]
	variableName    = 'TA_1_1_1'
	Evaluate        = 'TA_1_1_1 = TA_1_1_1;'
	title           = 'Air temperature at 7m (HMP)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_1_2_1'
	Evaluate        = 'TA_1_2_1 = TA_1_2_1;'
	title           = 'Air temperature at 2m (HMP)'
	units           = '^oC'
[End]

% gap-filled TA
[Trace]
	variableName    = 'TA_F_1_1_1'
	Evaluate        = 'TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_ECCC,[],[],[],"TA_F_1_1_1");'
	title           = 'Air temperature at 7m (HMP) gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_F_1_2_1'
	Evaluate        = 'TA_F_1_2_1 = gapFillUsingAltSensor(TA_1_2_1,TA_ECCC,[],[],[],"TA_F_1_2_1");'
	title           = 'Air temperature at 2m (HMP) gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

% pass through unfilled variables for Ameriflux
% non-gap-filled RH
[Trace]
	variableName    = 'RH_1_1_1'
    Evaluate        = 'RH_1_1_1 = RH_1_1_1;'
	title           = 'RH at 7m (HMP)'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_1_2_1'
    Evaluate        = 'RH_1_2_1 = RH_1_2_1;'
	title           = 'RH at 2m (HMP)'
	units           = '%'
[End]

% gap-filled RH
[Trace]
	variableName    = 'RH_F_1_1_1'
    Evaluate        =  'qaqcIn=[]; 
                        qaqcIn.polyfitWithoutClamped = 2;
                        qaqcIn.clamped_minMax = [0,100];
						qaqcIn.r2min = 0.89;		% default is 0.95, decided 0.89 is justified in this case (although only fair quality >0.8)
						qaqcIn.minSlope = 0.82;		% default is 0.95, decided 0.82 is justified in this case (although only fair quality >0.8)
                        RH_F_1_1_1 = gapFillUsingAltSensor(RH_1_1_1,RH_ECCC,[],qaqcIn,1,"RH_F_1_1_1");'
	title           = 'RH at 7m (HMP) gap-filled using ECCC climate station data'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_F_1_2_1'
    Evaluate        =  'qaqcIn=[]; 
                        qaqcIn.polyfitWithoutClamped = 2;
                        qaqcIn.clamped_minMax = [0,100];
						qaqcIn.r2min = 0.89;		% default is 0.95, decided 0.89 is justified in this case (although only fair quality >0.8)
						qaqcIn.minSlope = 0.81;		% default is 0.95, decided 0.81 is justified in this case (although only fair quality >0.8)
                        RH_F_1_2_1 = gapFillUsingAltSensor(RH_1_2_1,RH_ECCC,[],qaqcIn,1,"RH_F_1_2_1");'
	title           = 'RH at 2m (HMP) gap-filled using ECCC climate station data'
	units           = '%'
[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName    = 'VPD_1_1_1'
    Evaluate        = 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 7m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_1_2_1'
    Evaluate        = 'VPD_1_2_1 = vapPressDeficit(TA_1_2_1,RH_1_2_1);'
	title           = 'Vapour pressure deficit (from 2m HMP)'
	units           = 'hPa'
[End]

% gap-filled VPD
[Trace]
	variableName    = 'VPD_F_1_1_1'
    Evaluate        = 'VPD_F_1_1_1 = vapPressDeficit(TA_F_1_1_1,RH_F_1_1_1);'
	title           = 'Vapour pressure deficit (from 7m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_F_1_2_1'
    Evaluate        = 'VPD_F_1_2_1 = vapPressDeficit(TA_F_1_2_1,RH_F_1_2_1);'
	title           = 'Vapour pressure deficit (from 2m HMP)'
	units           = 'hPa'
[End]

