%
% File created:      20250415 (Zoran Nesic)
% Carbonique field site notes: https://davidulicio.github.io/carbonique_fieldnotes/
%
%
% Revisions
%
%   - 23 September 2026 (Rosie Howard)
%     % CHANGED 2026-09-23: AmeriFlux sign convention (+ = above the surface).
%     Sourced from Lvl_psi_Avg with the datum applied here; the positive gain is the
%     psi->m conversion and the offset is minus the sensors depth below the surface:
%       WTD = Lvl_psi_Avg * 0.70307 - 2.08
%     Datum from the field tie-in; anchored one day late, see header.
%
%   - 4 September 2026 (Rosie Howard)
%     Note that CS456 Lvl_m_Avg measurements (WTD_1_1_1) begin on 26 April 2026.
%
%   - 21 August 2026 (David Trejo)
%
%     (a) SOIL HEAT FLUX PLATE / CALIBRATION MISMATCH  ------------------------
%     The four HFP01 plates are connected to the AM16/32B in an order that does
%     not match the order of the sensitivities in CPU:UQAM_2.cal.
%
%     The logger program reads the cal file POSITIONALLY (Sub Read_Cal_File):
%     the 'Sensor: HFP01, S/N nnnnn' line is read and discarded, and only the
%     sensitivity line is parsed, so HFP_Sens(1..4) are filled in file order
%     (23099, 23100, 23101, 23102).  The measurement side is fixed by the
%     multiplexer clock position:
%         HFP_mV(1) -> mux 2H/2L   HFP_mV(3) -> mux 6H/6L
%         HFP_mV(2) -> mux 4H/4L   HFP_mV(4) -> mux 8H/8L
%
%       trace     mux ch   soil pit   S used (cal file)   S true (plate there)
%       G_1_1_1   2H/2L    Soil-1     61.33 (SN 23099)    60.03 (SN 23102)
%       G_2_1_1   4H/4L    Soil-2     62.61 (SN 23100)    61.33 (SN 23099)
%       G_3_1_1   6H/6L    Soil-4     61.08 (SN 23101)    62.61 (SN 23100)
%       G_4_1_1   8H/8L    Soil-5     60.03 (SN 23102)    61.08 (SN 23101)
%
%
%     The logger computes HFP() = 1000*HFP_mV()/HFP_Sens(), so
%         G_corrected = G_from_logger * S_used / S_true
%     applied below as currentCalibration
%         G_1_1_1  x 61.33/60.03 = 1.02166   (+2.17 %)
%         G_2_1_1  x 62.61/61.33 = 1.02087   (+2.09 %)
%         G_3_1_1  x 61.08/62.61 = 0.97556   (-2.44 %)
%         G_4_1_1  x 60.03/61.08 = 0.98281   (-1.72 %)
%     The four errors nearly cancel in the 4-plate mean (G_1 in
%     second stage shifts by ~0.02 %). The effect is on the individual plates
%     and on the spread between them.
%
%     The .cal file on the logger is NOT being changed, so these calibrations
%     are open-ended (no end date).  Start date is the first day of record for
%     UQAM_2 (2025-07-24, first archived logger table in Sites\UQAM_2\Met).
%     If the plates are ever rewired or the cal file reordered, add a second
%     row to currentCalibration
%
%     (b) SERIAL NUMBERS  ------------------------------------------------------
%     This file was copied from UQAM_1_FirstStage.ini and NONE of the
%     instrumentSN fields were updated - every one was still UQAM_1 hardware.
%     All are now set from the UQAM_2 equipment inventory (2026-08-21),
%     cross-checked against CPU:UQAM_2.cal and the field notes.
%
%       instrument     was (UQAM_1)   now (UQAM_2)
%       HFP01          23095-23098    23102 / 23099 / 23100 / 23101, by mux
%                                     channel - see note (a)
%       CNR4 / CNF4    234083         234084
%       CSAT3B         1891           1892
%       LI-7200RSF     72H-1201       72H-1206, then 72H-1207 from 2025-12-17
%       LI-7700        TG1-1008       TG1-1024
%       CR1000X        50873          50874
%       BaroVUE10      2790/2726      2800/2727
%       HygroVUE10     E5508/E5509    E5510 (upper) / E5511 (lower)
%       SQ-521 in      5724           5748 (upper)
%       SQ-521 out     5747           5749 (lower)
%       SnowVUE10      10954          10955
%       TE525WS        96386-0923     96383-0923
%       Young 05103    196257         196258
%       EasyProbe 20   10237152       10237153
%       CS456          -              70010296
%
%     (c) SOIL PROFILE - DEPTHS AND PROBE IDENTITIES  --------------------------
%     First, the profile is at Soil-3 and its deepest probe is at 45 cm, not
%     64 cm as in UQAM_1
%         1_1_1   8 cm   SN 61438        1_3_1   32 cm   SN 61426
%         1_2_1  16 cm   SN 61418        1_4_1   45 cm   SN 61425
%     Titles for the 1_4_1 traces are corrected accordingly.
%
%     Second, the four single-depth probes (all 8 cm) are at Soil-1, Soil-2,
%     Soil-4 and Soil-5, and are mapped to positions 2..5 in that order,
%     matching how the HFP01 plates are numbered at this site:
%         2_1_1  Soil-1  SN 61430        4_1_1  Soil-4  SN 61416
%         3_1_1  Soil-2  SN 61415        5_1_1  Soil-5  SN 61417
%     These eight positions are all logged by the program and none of them
%     beyond the profile were mapped before.
%
%     (d) OTHER MISSING VARIABLES  ---------------------------------------------
%     Compared against the Met_30m table of the logger program.  Also added:
%       t_CS650_1_1_1 .. t_CS650_1_4_1 - completes the CS650 output set
%         (SWC, S, TS, E, a were already mapped, the period t was not).
%       Voltage_12V / Voltage_24V - power system
%         diagnostics UQAM_2 is off-grid ('Line power: 0' in the cal file),
%         and the 2025 field notes are full of solar-power faults, so these
%         are worth having.
%       TW_2_1_1 - CS456 internal temperature.
%     Pluvio traces are deliberately NOT added: 'Pluvio: 0' in the cal file,
%       so P_2_1_1 and Pluvio_* are always NAN here.
%
%     WTD_1_1_1 now comes from the CS456 (Lvl_m_Avg) instead of the EasyProbe
%     level channel (L_WATER_Avg).  The
%     trace keeps its name, only its source changes.  The other EasyProbe
%     channels (TW, pH, ORP, COND, DO) are unaffected.
%
%     (e) OTHER FIXES  ---------------------------------------------------------
%     globalVars.Trace.{SW_OUT,LW_IN,LW_OUT,NETRAD,ALB}_1_1_1.instrumentSN were
%     assigned from .instrument instead of .instrumentSN, so those five traces
%     carried the string 'CNR4' as their serial number.
%     E_CS650_1_2_1 carried the 1_1_1 probes serial number.
%     The DP_1_1_1 and DP_1_2_1 traces name the instrument 'HydroVUE10'; the
%     sensor is a HygroVUE10.  Fixed.
%
%     (f) NOT AN INI ISSUE, BUT FLAGGING IT  -----------------------------------
%     UQAM_2_config.yml has northOffset: 285, the same value as UQAM_1 and
%     UQAM_3. The real one should be 264°
%
%  	- 25 March 2026 (Umair)
%   - For WS_1_1_1, the input file name changes from August 2024. Before August 2024, it was WS, 
%     and after August 2024, it is now WS_Avg.

Site_name = 'Natural Open Bog'
SiteID = 'UQAM_2'

Difference_GMT_to_local_time = 5    % hours (GMT - PST)
Timezone = 5                        % hours
% if Timezone == 0 then the database is in UTC/GMT 
% if Timezone == Difference_GMT_to_local_time then the database is in ST
% having the offset positive when it should be negative (after all PST = GMT - 8)
% is a legacy issue that (hopefully) will be sorted out at some point in the future.


