% CHANGED 2026-09-23: AmeriFlux sign convention (+ = above the surface).
% Sourced from Lvl_psi_Avg with the datum applied here; the positive gain is the
% psi->m conversion and the offset is minus the sensors depth below the surface:
%     WTD = Lvl_psi_Avg * 0.70307 - 2.08
% Datum from the field tie-in: anchored one day late, see header.

[Trace]
    variableName        = 'WTD_1_1_1'
    title               = 'water table depth - CS456 (+ve = above surface)'
    originalVariable    = 'gauge pressure above the transducer'
    inputFileName       = {'Lvl_psi_Avg'}
    inputFileName_dates = [ datenum(2026,4,28) datenum(2999,12,31)]
    measurementType     = 'Met'
    units               = 'm'
    instrument          = 'CS456'
    instrumentType      = ''
    instrumentSN        = '70010296'
    loggedCalibration   = []
    currentCalibration  = [ 0.70307 -2.08 datenum(2026,4,28) datenum(2999,12,31)]
    comments            = 'Sensor 2.08 m below the peat surface. Tie-in: WTD = -0.13 m at installation (reported 2026-04-26), anchored to the first settled head of 1.9533 m on 2026-04-28 00:00 because the record starts 2026-04-27 13:30. Was Lvl_m_Avg with an in-logger offset of 0.79 m, which was about 1.3 m short.'
    minMax              = [-0.6 0.3]
    zeroPt              = [-9999]
[End]

