%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Second stage ini_file for UQAM_3
%
% Apr 12, 2025 Zoran Nesic
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Revisions:
%
% September 23, 2026 (Rosie Howard/David)
%	- WTD_1_1_1 CHANGED 2026-09-23: AmeriFlux sign, + = above the surface.  
%	  Arrives from first stage as Lvl_psi_Avg with the datum applied there
%	  (sensor 1.83 m below the peat surface, confirmed by tape on 2026-06-10.)
%
% September 4, 2026 (Rosie Howard)
%	- No water table depth passed from first stage for 2025 (per David), 
%	  source instrument changed and measurements start April 2026. 
%	  Edited WTD_1_1_1 to be all NaNs in 2025 for second stage.
%
% August 20, 2026 (David Trejo)
%   - Companion to the first-stage soil-heat-flux fix.  No change is needed
%     here for the calibration itself: G_1_1_1..G_4_1_1 arrive from first
%     stage already corrected, so G_1 (their mean) picks the fix up for free.
%     For the record, the per-plate corrections are +0.75, -2.52, +3.35 and
%     -1.48 %, and they nearly cancel in the mean - G_1 shifts by ~0.03 %.
%     The visible change will be in the spread between the four plates, not
%     in the average, so do not expect G_1 to move much when testing.
%   - Added pass-through traces for the four individual soil heat flux plates.
%     Ameriflux wants G_1_1_1..G_4_1_1 as well as an aggregate, and having
%     them here also makes the per-plate correction visible in second-stage
%     plots instead of being hidden inside the mean.
%   - Added pass-through traces for SWC_1_1_1..SWC_1_4_1 and D_SNOW, which
%     exist in first stage but had no second-stage trace, so they were not
%     reaching third stage / Ameriflux.
%   - Added TA_1_3_1, TA_1_4_1, RH_1_3_1 and RH_1_4_1, matching the new traces
%     in UQAM_3_FirstStage.ini 
%   - Added SWC_2_1_1..SWC_5_1_1 and TS_2_1_1..TS_5_1_1.
%   - WTD_1_1_1 keeps its name but now arrives from the CS456 pressure
%     transducer instead of the EasyProbe level channel, which doesnt have a WTD sensor
%     The CS456 went in on 2026-04-15, so WTD_1_1_1 is
%     empty before that date - the 2025 season has no water table depth.
%     Title and units updated to match. the Evaluate is unchanged.
%   - Fixed two units strings G_1 was labelled 'oC' when it is a heat flux.
%   - Noticed but not changed: USTAR is defined twice in this file.
%   - Modified heights of the HygroVUE sensors
%
% May 11, 2026 Karolina
%   -  Edited gap filled variables to have correct Ameriflux formatting (e.g. TA_F_1_1_1 instead of TA_1_1_1_F). 
%   -  See bottom of webpage: https://ameriflux.lbl.gov/data/aboutdata/data-variables/
%
% March 23, 2026 Umair
% 
% 	- Changed notation to be "Ameriflux-friendly": provide both non-gap-filled and gap-filled variables for AMF, 
% 	  as well as gap-filled '_F' for internal/data sharing.
%	- Switched height order for TA and RH, since Ameriflux requires upper-most air measurements to be e.g. TA_1_1_1, 
%     then second highest TA_1_2_1, etc. These were the wrong way round in earlier versions of the file. 
%
% 	- RH from ECCC is a good fit so we gapfilled the RH_1_1_1_F and RH_1_2_1_F traces. RH_1_2_1 missing substantial data
%     during growing season (July), so modifying slope and r2 value is justified.
%   - @Rosie: G_1: Check with David to confirm about taking average for four G_*_*_* variables at different horizontal locations. 
%     And are they at same vertical depth? and which depth are they?
%   - For P_RAIN_1_1_1 and P_ECCC, the variables are different and we can't use P_ECCC for gapfilling P_RAIN_1_1_1. 
%     So, I removed the P_RAIN_1_1_1_F trace.
%   - For (WS_1_1_1, WD_1_1_1) and (WS_ECCC, WD_ECCC), the variables are different and we can't use *_ECCC for gapfilling WS/WD_1_1_1. 
%     Becasue its not a good fit.
%     So, I comment out the WS/WD_1_1_1_F trace. There is no missing data for both these variables for 2025 and it can be tested with ERA-5 
%     later, if needed.
%   - @Rosie: Please review the wind_speed and wind_dir from Flux. 
%   - Wind direction filtering (badWD) moved to third stage (this happened some time ago).


Site_name = 'UQAM_3'
SiteID = 'UQAM_3'
input_path    = ''
output_path   = '' 
high_level_path = {}
searchPath = 'auto'
 
% Contents:
% Misc. variables
% Profiles
% Radiation
% Soil
% Turbulent fluxes
% Carbon balance terms
% Energy storage terms

% create a generic trace and variables
% the variables created here will be available to all other traces below
% and that saves some extra typing.
[Trace]
	variableName 	= 'all_nan'
	Evaluate 		= 'all_nan = nan(size(clean_tv));
                		processingYear = yearIn;'
	title 			= 'definitions of a all_nan trace and some global variables'
	units 			= ''
[End]


% ----------------------------------------------------------------------------
% Misc. important variables - temperature, pressure etc.
% ----------------------------------------------------------------------------

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'TA_1_1_1'
	Evaluate        = 'TA_1_1_1 = TA_1_1_1;'
	title           = 'Air temperature at 22m (HMP)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_1_2_1'
	Evaluate        = 'TA_1_2_1 = TA_1_2_1;'
	title           = 'Air temperature at 16m (HMP)'
	units           = '^oC'
[End]

% gap-filled TA
[Trace]
	variableName    = 'TA_F_1_1_1'
	Evaluate        = 'TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_ECCC,[],[],[],"TA_F_1_1_1");'
	title           = 'Air temperature at 22m (HMP) gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_F_1_2_1'
	Evaluate        = 'TA_F_1_2_1 = gapFillUsingAltSensor(TA_1_2_1,TA_ECCC,[],[],[],"TA_F_1_2_1");'
	title           = 'Air temperature at 16m (HMP) gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'RH_1_1_1'
    Evaluate        = 'RH_1_1_1 = RH_1_1_1;'
	title           = 'RH at 22m (HMP)'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_1_2_1'
    Evaluate        = 'RH_1_2_1 = RH_1_2_1;'
	title           = 'RH at 16m (HMP)'
	units           = '%'
[End]

% gap-filled RH
[Trace]
	variableName    = 'RH_F_1_1_1'
    Evaluate        =  'qaqcIn=[]; 
                        qaqcIn.polyfitWithoutClamped = 2;
                        qaqcIn.clamped_minMax = [0,100];
                        qaqcIn.r2min = 0.92;        % default is 0.95, determined 0.92 is justified after testing
                        [RH_F_1_1_1, qaqcOut] = gapFillUsingAltSensor(RH_1_1_1,RH_ECCC,[],qaqcIn,1,"RH_F_1_1_1 with ECCC");'
	title           = 'RH at 22m (HMP) gap-filled using ECCC climate station data'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_F_1_2_1'
    Evaluate        =  'qaqcIn=[]; 
                        qaqcIn.polyfitWithoutClamped = 2;
                        qaqcIn.clamped_minMax = [0,100];
                        qaqcIn.r2min = 0.94;        % default is 0.95, determined 0.94 is justified after testing
                        qaqcIn.maxSlope = 1.06;        % default is 1.05, determined 1.06 is justified after testing.
                        [RH_F_1_2_1, qaqcOut] = gapFillUsingAltSensor(RH_1_2_1,RH_ECCC,[],qaqcIn,1,"RH_F_1_2_1 with ECCC");'
    title           = 'RH at 16m (HMP) gap-filled using ECCC climate station data'
	units           = '%'
[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName    = 'VPD_1_1_1'
    Evaluate        = 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 22m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_1_2_1'
    Evaluate        = 'VPD_1_2_1 = vapPressDeficit(TA_1_2_1,RH_1_2_1);'
	title           = 'Vapour pressure deficit (from 16m HMP)'
	units           = 'hPa'
[End]

% gap-filled VPD
[Trace]
	variableName    = 'VPD_F_1_1_1'
    Evaluate        = 'VPD_F_1_1_1 = vapPressDeficit(TA_F_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 22m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_F_1_2_1'
    Evaluate        = 'VPD_F_1_2_1 = vapPressDeficit(TA_F_1_2_1,RH_1_2_1);'
	title           = 'Vapour pressure deficit (from 16m HMP)'
	units           = 'hPa'
[End]


[Trace]
	variableName    = 'TS_1'
	Evaluate        = 'TS_1 = TS_1_1_1;'
	title           = 'average soil temperature at 8cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_2'
	Evaluate        = 'TS_2 = TS_1_2_1;'
	title           = 'average soil temperature at 16cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_3'
	Evaluate        = 'TS_3 = TS_1_3_1;'
	title           = 'average soil temperature at 32cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_4'
	Evaluate        = 'TS_4 = TS_1_4_1;'
	title           = 'average soil temperature at 64cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'G_1_1_1'
	Evaluate        = 'G_1_1_1 = G_1_1_1;'
	title           = 'soil heat flux at 8cm depth'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_2_1_1'
	Evaluate        = 'G_2_1_1 = G_2_1_1;'
	title           = 'soil heat flux at 8cm depth'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_3_1_1'
	Evaluate        = 'G_3_1_1 = G_3_1_1;'
	title           = 'soil heat flux at 8cm depth'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_4_1_1'
	Evaluate        = 'G_4_1_1 = G_4_1_1;'
	title           = 'soil heat flux at 8cm depth'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_1'
	Evaluate        = 'G_1 = mean([G_1_1_1, G_2_1_1, G_3_1_1, G_4_1_1],2,"omitnan");'
	title           = 'soil heat flux at 5cm depth'
	units           = 'W/m^2'
[End]

% ----------------------------------------------------------------------------
% ADDED 2026-08-20 - first-stage traces that had no second-stage trace,
% plus the traces added to UQAM_3_FirstStage.ini.
% ----------------------------------------------------------------------------

% Individual soil heat flux plates.  These carry the per-plate sensitivity
% correction applied in first stage. G_1 above is their mean.

[Trace]
	variableName    = 'G_1_1_1'
	Evaluate        = 'G_1_1_1 = G_1_1_1;'
	title           = 'soil heat flux - HFP01 SN 23104 (mux 2H/2L)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_2_1_1'
	Evaluate        = 'G_2_1_1 = G_2_1_1;'
	title           = 'soil heat flux - HFP01 SN 23105 (mux 4H/4L)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_3_1_1'
	Evaluate        = 'G_3_1_1 = G_3_1_1;'
	title           = 'soil heat flux - HFP01 SN 23106 (mux 6H/6L)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_4_1_1'
	Evaluate        = 'G_4_1_1 = G_4_1_1;'
	title           = 'soil heat flux - HFP01 SN 23103 (mux 8H/8L)'
	units           = 'W/m^2'
[End]

% Soil water content profile - present in first stage but never passed through.

[Trace]
	variableName    = 'SWC_1_1_1'
	Evaluate        = 'SWC_1_1_1 = SWC_1_1_1;'
	title           = 'soil water content at 8cm'
	units           = '%'
[End]

[Trace]
	variableName    = 'SWC_1_2_1'
	Evaluate        = 'SWC_1_2_1 = SWC_1_2_1;'
	title           = 'soil water content at 16cm'
	units           = '%'
[End]

[Trace]
	variableName    = 'SWC_1_3_1'
	Evaluate        = 'SWC_1_3_1 = SWC_1_3_1;'
	title           = 'soil water content at 32cm'
	units           = '%'
[End]

[Trace]
	variableName    = 'SWC_1_4_1'
	Evaluate        = 'SWC_1_4_1 = SWC_1_4_1;'
	title           = 'soil water content at 64cm'
	units           = '%'
[End]

% CS650 positions 2..5 - new in UQAM_3_FirstStage.ini.

[Trace]
	variableName    = 'SWC_2_1_1'
	Evaluate        = 'SWC_2_1_1 = SWC_2_1_1;'
	title           = 'soil water content at 8cm - position 2'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_2_1_1'
	Evaluate        = 'TS_2_1_1 = TS_2_1_1;'
	title           = 'soil temperature at 8cm - position 2'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'SWC_3_1_1'
	Evaluate        = 'SWC_3_1_1 = SWC_3_1_1;'
	title           = 'soil water content at 8cm - position 3'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_3_1_1'
	Evaluate        = 'TS_3_1_1 = TS_3_1_1;'
	title           = 'soil temperature at 8cm - position 3'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'SWC_4_1_1'
	Evaluate        = 'SWC_4_1_1 = SWC_4_1_1;'
	title           = 'soil water content at 8cm - position 4'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_4_1_1'
	Evaluate        = 'TS_4_1_1 = TS_4_1_1;'
	title           = 'soil temperature at 8cm - position 4'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'SWC_5_1_1'
	Evaluate        = 'SWC_5_1_1 = SWC_5_1_1;'
	title           = 'soil water content at 8cm - position 5'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_5_1_1'
	Evaluate        = 'TS_5_1_1 = TS_5_1_1;'
	title           = 'soil temperature at 8cm - position 5'
	units           = '^oC'
[End]

% Snow depth - present in first stage but never passed through.

[Trace]
	variableName    = 'D_SNOW'
	Evaluate        = 'D_SNOW = D_SNOW;'
	title           = 'snow depth (SnowVUE10)'
	units           = 'cm'
[End]

% Third and fourth HygroVUE10 - new in UQAM_3_FirstStage.ini.

[Trace]
	variableName    = 'TA_1_3_1'
	Evaluate        = 'TA_1_3_1 = TA_1_3_1;'
	title           = 'Air temperature at level 3 (height 9m)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_1_4_1'
	Evaluate        = 'TA_1_4_1 = TA_1_4_1;'
	title           = 'Air temperature at level 4, near-surface (height 2m)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'RH_1_3_1'
	Evaluate        = 'RH_1_3_1 = RH_1_3_1;'
	title           = 'RH at level 3 (height 9m)'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_1_4_1'
	Evaluate        = 'RH_1_4_1 = RH_1_4_1;'
	title           = 'RH at level 4, near-surface (height 2m)'
	units           = '%'
[End]

[Trace]
	variableName    = 'SW_IN_1_1_1'
	Evaluate        = 'SW_IN_1_1_1 = SW_IN_1_1_1;'
	title           = 'incoming shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'SW_OUT_1_1_1'
	Evaluate        = 'SW_OUT_1_1_1 = SW_OUT_1_1_1;'
	title           = 'reflected shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'LW_IN_1_1_1'
	Evaluate        = 'LW_IN_1_1_1 = LW_IN_1_1_1;'
	title           = 'incoming long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'LW_OUT_1_1_1'
	Evaluate        = 'LW_OUT_1_1_1 = LW_OUT_1_1_1;'
	title           = 'outgoing long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'RG_1_1_1'
	Evaluate        = 'RG_1_1_1 = SW_IN_1_1_1+LW_IN_1_1_1;'
	title           = 'Global Radiation - total incoming SW & LW'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'NETRAD_1_1_1'
    Evaluate        = 'NETRAD_1_1_1 = calcNetRad(SW_IN_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);'
	title           = 'net radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'ALB_1_1_1'
    Evaluate        = 'ALB_1_1_1 = calcAlb(SW_IN_1_1_1,SW_OUT_1_1_1);'
	title           = 'albedo by CNR4'
	units           = '%'
[End]

[Trace]
	variableName    = 'PPFD_IN_1_1_1'
	Evaluate        = 'PPFD_IN_1_1_1 = PPFD_IN_1_1_1;'
	title           = 'incoming PAR'
	units           = '\mu mol/m^2/s'
[End]

[Trace]
	variableName    = 'PPFD_OUT_1_1_1'
	Evaluate        = 'PPFD_OUT_1_1_1 = PPFD_OUT_1_1_1;'
	title           = 'reflected PAR'
	units           = '\mu mol/m^2/s'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'PA_1_1_1'
	Evaluate        = 'PA_1_1_1 = PA_1_1_1;'
	title           = 'air pressure by CS106 installed in the logger box'
	units           = 'kPa'
[End]

% gap-filled PA
[Trace]
	variableName    = 'PA_F_1_1_1'
    Evaluate        = 'PA_F_1_1_1 = gapFillUsingAltSensor(PA_1_1_1,PA_ECCC,[],[], 1,"PA_F_1_1_1");'
	title           = 'air pressure by CS106 installed in the logger box, gap-filled using ECCC climate station data'
	units           = 'kPa' 
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'P_RAIN_1_1_1'
	Evaluate        = 'P_RAIN_1_1_1 = P_RAIN_1_1_1;'
	title           = 'precipitation at 1.5m height'
	units           = 'mm'
[End]

% gap-filled P_RAIN
% No suitable alternative data.

[Trace]
	variableName    = 'DO_1_1_1'
	Evaluate        = 'DO_1_1_1 = DO_1_1_1;'
	title           = 'dissolved oxygen'
	units           = 'mg/l'
[End]

[Trace]
	variableName    = 'DOperc_1_1_1'
	Evaluate        = 'DOperc_1_1_1 = DOperc_1_1_1;'
	title           = 'dissolved oxygen ratio'
	units           = '% saturation'
[End]

[Trace]
	variableName    = 'COND_WATER_1_1_1'
	Evaluate        = 'COND_WATER_1_1_1 = COND_WATER_1_1_1;'
	title           = 'conductivity of water'
	units           = 'microS/cm'
[End]

% I think this was copy/pasted from another site, quite specific calculation. Commenting out for now (Rosie, 23 Sept 2026)
%[Trace]
%	variableName    = 'Salinity'
%	Evaluate        = 'Salinity = ((COND_WATER_1_1_1/1000).^1.0878).*0.4665; % unit: g/L, ppt;'
