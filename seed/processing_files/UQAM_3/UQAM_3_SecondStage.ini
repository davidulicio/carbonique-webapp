% WTD_1_1_1 CHANGED 2026-08-21: now sourced from the CS456 in first stage instead of
% the EasyProbe level channel.  Empty before 2026-04-15.
% WTD_1_1_1 CHANGED 2026-09-23: AmeriFlux sign, + = above the surface.  Arrives from first
% stage as Lvl_psi_Avg with the datum applied there (sensor 1.83 m below the peat surface, confirmed by tape on 2026-06-10.)
[Trace]
	variableName    = 'WTD_1_1_1'
	Evaluate        = 'if (processingYear == 2025),
							WTD_1_1_1 = all_nan;
						else
							WTD_1_1_1 = WTD_1_1_1;
						end;'
	title           = 'water table depth - CS456 (+ = above surface)'
	units           = 'm'
[End]

[Trace]
	variableName    = 'ORP_1_1_1'
	Evaluate        = 'ORP_1_1_1 = ORP_1_1_1;'
	title           = 'oxygen reduction potential'
	units           = 'mV'
[End]

[Trace]
	variableName    = 'pH_1_1_1'
	Evaluate        = 'pH_1_1_1 = pH_1_1_1;'
	title           = 'water pH'
	units           = 'unitless'
[End]

[Trace]
	variableName    = 'TW_1_1_1'
	Evaluate        = 'TW_1_1_1 = TW_1_1_1;'
	title           = 'water temperature'
	units           = '^oC'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'WS_1_1_1'
	Evaluate        = 'WS_1_1_1 = WS_1_1_1;'
	title           = 'wind speed by RM Young 05103'
	units           = 'm/s'
[End]

