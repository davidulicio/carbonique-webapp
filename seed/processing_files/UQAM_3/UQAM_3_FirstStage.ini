[Trace]
    variableName         = 'WD_1_1_1'
    title                = 'wind direction - wind monitor'
    originalVariable     = ''
    inputFileName        = {'WD'}
    inputFileName_dates  = [ datenum(2024,1,1) datenum(2999,12,31)]
    measurementType      = 'Met'
    units                = '°'
    instrument           = 'RM Young wind monitor 05103'
    instrumentSN         = '196259'
       loggedCalibration = [ 1 0    datenum(2024,1,1) datenum(2025,08,26,14,0,0);   1 0 datenum(2025,08,26,14,30,0) datenum(2999,12,31)] 
       currentCalibration= [ 1 +120 datenum(2024,1,1) datenum(2025,08,26,14,0,0);   1 0 datenum(2025,08,26,14,30,0) datenum(2999,12,31)]
    % Note - Sep_09_2025 from David: 
    % Direction box of the wind monitor (Young) was not properly oriented. 
    % It was looking at 300° from north. I have repositioned the box as it should be looking to south.
    % So all the wind directions from the Young wind monitor before 14:00 26-08-2025 were using the box looking to 300° instead of 180°. 
    % Hence we will need to shift the wind direction previous to that timestamp.
    comments             = ''
    minMax               = [-Inf,360]
    dependent            = ''
    zeroPt               = -9999
    postEvaluate         = 'WD_1_1_1(WD_1_1_1>360) = WD_1_1_1(WD_1_1_1>360)-360;'
[End]

