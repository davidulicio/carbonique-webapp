%
% File created:      20250412 (Zoran Nesic)
% Carbonique field site notes: https://davidulicio.github.io/carbonique_fieldnotes/
%
%
% Revisions:
%
%   - 23 September 2026 (Rosie Howard/David)
%     % CHANGED 2026-09-23: AmeriFlux sign convention (+ = above the surface).
%     Sourced from Lvl_psi_Avg with the datum applied here: the positive gain is the
%     psi->m conversion and the offset is minus the sensors depth below the surface:
%       WTD = Lvl_psi_Avg * 0.70307 - 1.83
%     Datum confirmed by field measurement.
%
%   - 4 September 2026 (Rosie Howard)
%     Note that CS456 Lvl_m_Avg measurements (WTD_1_1_1) begin on 15 April 2026.
%
%   - 20 August 2026 (David Trejo)
%
%     (a) SOIL HEAT FLUX PLATE / CALIBRATION MISMATCH  ------------------------
%     Field check of the AM16/32B wiring on 20 August 2026 found the four
%     HFP01 plates connected in an order that does not match the order of the
%     sensitivities in CPU:UQAM_3.cal.
%
%     The logger program (UQAM V17.CR1X, Sub Read_Cal_File) reads the cal file
%     POSITIONALLY: the 'Sensor: HFP01, S/N nnnnn' line is read and discarded,
%     and only the sensitivity line is parsed, so HFP_Sens(1..4) are filled in
%     file order (23103, 23104, 23105, 23106).  The measurement side is fixed
%     by the multiplexer clock position:
%         HFP_mV(1) -> mux 2H/2L   HFP_mV(3) -> mux 6H/6L
%         HFP_mV(2) -> mux 4H/4L   HFP_mV(4) -> mux 8H/8L
%     The wiring is a one-position cyclic shift of the cal-file order, so every
%     plate is divided by a neighbours sensitivity.
%
%       trace     mux ch   S used (cal file)     S true (plate on that ch)
%       G_1_1_1   2H/2L    62.06  (SN 23103)     61.60  (SN 23104)
%       G_2_1_1   4H/4L    61.60  (SN 23104)     63.19  (SN 23105)
%       G_3_1_1   6H/6L    63.19  (SN 23105)     61.14  (SN 23106)
%       G_4_1_1   8H/8L    61.14  (SN 23106)     62.06  (SN 23103)
%
%     The logger computes HFP() = 1000*HFP_mV()/HFP_Sens(), so
%         G_corrected = G_from_logger * S_used / S_true
%     which is applied below as currentCalibration, same pattern as the
%     UQAM_1 G_1_1_1 fix (Sep 2025).  Resulting corrections:
%         G_1_1_1  x 62.06/61.60 = 1.00747   (+0.75 %)
%         G_2_1_1  x 61.60/63.19 = 0.97484   (-2.52 %)
%         G_3_1_1  x 63.19/61.14 = 1.03353   (+3.35 %)
%         G_4_1_1  x 61.14/62.06 = 0.98518   (-1.48 %)
%     The four errors very nearly cancel in the 4-plate mean (G_1 in second
%     stage changes by ~0.03 %); the effect is on the individual plates and on
%     the spread between them.
%
%     The .cal file on the logger is NOT being changed, so these calibrations
%     are open-ended (no end date).  Start date is the first day of record for
%     UQAM_3 (2025-07-24, first archived logger table in \Sites\UQAM_3\Met).
%     If the plates are ever rewired or the cal file reordered, add a second
%     row to currentCalibration - the pipeline requires all calibration rows
%     on a single line, separated by semicolons.
%
%     (b) SERIAL NUMBERS  ------------------------------------------------------
%     This file was originally copied from UQAM_1_FirstStage.ini and NONE of the
%     instrumentSN fields were updated - every one of them was still UQAM_1
%     hardware.  All are now set from the UQAM_3 equipment inventory
%     (2026-08-21)
%
%     Note the LI-7550 and SmartFlux were swapped on 2026-04-15
%     (AIU-2494 -> AIU-2492, 00780 -> 00785).
%
%     (c) MISSING VARIABLES  ---------------------------------------------------
%     Compared the traces defined here against the Met_30m table of the running
%     program.  Added below, in the ADDED 2026-08-21 section:
%       TA/RH/DP/VP _1_3_1 and _1_4_1
%       t_CS650_1_1_1 .. t_CS650_1_4_1 - completes the CS650 output set
%         (SWC, S, TS, E, a were already mapped; the period t was not).
%       Voltage_12V / Voltage_24V - power system
%         diagnostics; UQAM_3 is off-grid ('Line power: 0' in the cal file).
%       SWC_2_1_1 .. SWC_5_1_1 and TS_2_1_1 .. TS_5_1_1 
%       TW_2_1_1 - CS456 internal temperature, installed 2026-04-15.
%       Pluvio traces are deliberately NOT added: 'Pluvio: 0' in the cal file,
%         so P_2_1_1 and Pluvio_* are always NAN at this site.
%
%     WTD_1_1_1 now comes from the CS456 (Lvl_m_Avg) instead of the EasyProbe
%     level channel (L_WATER_Avg), which doesnt have a wtd sensor
%     The trace keeps its name, only its source changes.  The CS456
%     was installed on 2026-04-15, so WTD_1_1_1 now starts on that date and
%     there is no water table depth for the 2025 season.  The other EasyProbe
%     channels (TW, pH, ORP, COND, DO) are unaffected.
%
%     (d) OTHER FIXES  ---------------------------------------------------------
%     globalVars.Trace.{SW_OUT,LW_IN,LW_OUT,NETRAD,ALB}_1_1_1.instrumentSN were
%     assigned from .instrument instead of .instrumentSN, so those five traces
%     carried the string 'CNR4' as their serial number.
%
%     (e) NOT AN INI ISSUE, BUT FLAGGING IT  -----------------------------------
%     UQAM_3_config.yml has northOffset: 285, which is UQAM_1s boom azimuth.
%     The UQAM_3s eddy boom is headed to 332 deg
%     the northOffset drives the third-stage wake filter - worth checking before the next run.
%
%  	- 25 March 2026 (Umair)
%   - For WS_1_1_1, the input file name changes from August 2024. Before August 2024, it was WS, 
%     and after August 2024, it is now WS_Avg.
%   - @Rosie: Storage fluxes missing completely for 2025. Can Storage fluxes be recalculated?

Site_name = 'Natural Forest Bog'
SiteID = 'UQAM_3'

Difference_GMT_to_local_time = 5    % hours (GMT - PST)
Timezone = 5                        % hours
% if Timezone == 0 then the database is in UTC/GMT 
% if Timezone == Difference_GMT_to_local_time then the database is in ST
% having the offset positive when it should be negative (after all PST = GMT - 8)
% is a legacy issue that (hopefully) will be sorted out at some point in the future.


