% CHANGED 2026-08-21: source moved from the EasyProbe level channel
% (L_WATER_Avg), which was giving incorrect water table depths, to the
% CS456 pressure transducer (Lvl_m_Avg).  The logger already subtracts the
% CS456 offset from the cal file (1.48 m), so no calibration is needed here.
% The CS456 was installed 2026-04-15, so there is no WTD before that date.

% CHANGED 2026-09-23: AmeriFlux sign convention (+ = above the surface).
% Sourced from Lvl_psi_Avg with the datum applied here; the positive gain is the
% psi->m conversion and the offset is minus the sensors depth below the surface:
%     WTD = Lvl_psi_Avg * 0.70307 - 1.83
% Datum confirmed by field measurement.
[Trace]
    variableName        = 'WTD_1_1_1'
    title               = 'water table depth - CS456 (+ = above surface)'
    originalVariable    = 'gauge pressure above the transducer'
    inputFileName       = {'Lvl_psi_Avg'}
    inputFileName_dates = [ datenum(2026,4,21,16,0,0) datenum(2999,12,31)]
    measurementType     = 'Met'
    units               = 'm'
    instrument          = 'CS456'
    instrumentType      = ''
    instrumentSN        = '70010297'
