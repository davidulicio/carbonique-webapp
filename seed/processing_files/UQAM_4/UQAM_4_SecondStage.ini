% Revisions:
%
% Sept 23, 2026 (Rosie)
%	- Modified qaqcIn for gapfilling RH_1_1_1 and RH_1_2_1.
%
% Sept 22, 2026 (Rosie)
%	- Met gap-filling:
%		- Updated gap-filling function to gapFillUsingAltSensor. 
%		- Included proper Ameriflux notation, e.g., TA_F_1_1_1.
%		- Comment below from Karolina (11 May), ran script to convert but was actually no gap-filled notation.
%	- Corrected copy/paste issues, e.g. calibration constants for G_1 removed, they are not relevant to this site (confirmed with David).
%	- Added calcAlb, calcNetRad, and vapPressDeficit functions to simplify.
%
% May 11, 2026 Karolina
%   -  Edited gap filled variables to have correct Ameriflux formatting (e.g. TA_F_1_1_1 instead of TA_1_1_1_F). 
%   -  See bottom of webpage: https://ameriflux.lbl.gov/data/aboutdata/data-variables/



Site_name = 'St-Remi Disturbed Forested Peatland'
SiteID = 'UQAM_4'
input_path    = ''
output_path   = '' 
high_level_path = {}
searchPath = 'auto'
 
% Contents:
% Misc. variables
% Profiles
% Radiation
% Soil
% Turbulent fluxes
% Carbon balance terms
% Energy storage terms


% ----------------------------------------------------------------------------
% Misc. important variables - temperature, pressure etc.
% ----------------------------------------------------------------------------

% non-gapfilled TA
[Trace]
	variableName    = 'TA_1_1_1'
	Evaluate        = 'TA_1_1_1 = TA_1_1_1;'
	title           = 'Air temperature at 2m (HMP)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_1_2_1'
    Evaluate        = 'TA_1_2_1 = TA_1_2_1;'
	title           = 'Air temperature at 7m (HMP)'
	units           = '^oC'
[End]

% gap-filled TA
[Trace]
	variableName    = 'TA_F_1_1_1'
	Evaluate        = 'TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_ECCC,[],[],1,"TA_F_1_1_1");'
	title           = 'Air temperature at 2m (HMP) gap-filled using ECCC'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_F_1_2_1'
    Evaluate        = 'TA_F_1_2_1 = gapFillUsingAltSensor(TA_1_2_1,TA_ECCC,[],[],1,"TA_F_1_2_1");'
	title           = 'Air temperature at 7m (HMP) gap-filled using ECCC'
	units           = '^oC'
[End]

% non-gapfilled RH
[Trace]
	variableName    = 'RH_1_1_1'
    Evaluate        = 'RH_1_1_1 = RH_1_1_1;'
	title           = 'RH at 2m (HMP)'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_1_2_1'
	Evaluate        = 'RH_1_2_1 = RH_1_2_1;'
	title           = 'RH at 7m (HMP)'
	units           = '%'
[End]

% gap-filled RH
[Trace]
	variableName    = 'RH_F_1_1_1'
    Evaluate        = 'qaqcIn = [];
					   qaqcIn.polyfitWithoutClamped = 2;
                       qaqcIn.clamped_minMax = [0,100];
					   qaqcIn.r2min = 0.91;
					   qaqcIn.minSlope = 0.84;
					   RH_F_1_1_1 = gapFillUsingAltSensor(RH_1_1_1,RH_ECCC,[],qaqcIn,1,"RH_F_1_1_1");'
	comments 		= 'qaqcIn values justified following testing (Rosie)'
	title           = 'RH at 2m (HMP) gap-filled using ECCC'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_F_1_2_1'
	Evaluate        = 'qaqcIn = [];
					   qaqcIn.polyfitWithoutClamped = 2;
                       qaqcIn.clamped_minMax = [0,100];
					   qaqcIn.r2min = 0.91;
					   qaqcIn.minSlope = 0.81;
					   RH_F_1_2_1 = gapFillUsingAltSensor(RH_1_2_1,RH_ECCC,[],qaqcIn,1,"RH_F_1_2_1");'
	comments 		= 'qaqcIn values justified following testing (Rosie)'
	title           = 'RH at 7m (HMP) gap-filled using ECCC'
	units           = '%'
[End]

% non-gapfilled VPD
[Trace]
	variableName    = 'VPD_1_1_1'
	Evaluate        = 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 2m HMP)'
	units           = 'hPa'
[End]

% gap-filled VPD
[Trace]
	variableName    = 'VPD_F_1_1_1'
	Evaluate        = 'VPD_F_1_1_1 = vapPressDeficit(TA_F_1_1_1,RH_F_1_1_1);'
	title           = 'Vapour pressure deficit (from 2m HMP) gap-filled'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'TS_1'
	Evaluate        = 'TS_1 = TS_1_1_1;'
	title           = 'average soil temperature at 8cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_2'
	Evaluate        = 'TS_2 = TS_1_2_1;'
	title           = 'average soil temperature at 16cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_3'
	Evaluate        = 'TS_3 = TS_1_3_1;'
	title           = 'average soil temperature at 32cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_4'
	Evaluate        = 'TS_4 = TS_1_4_1;'
	title           = 'average soil temperature at 64cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'G_1_1_1'
	Evaluate        = 'G_1_1_1 = G_1_1_1;'
	title           = 'soil heat flux at 8cm depth'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_2_1_1'
	Evaluate        = 'G_2_1_1 = G_2_1_1;'
	title           = 'soil heat flux at 8cm depth'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_3_1_1'
	Evaluate        = 'G_3_1_1 = G_3_1_1;'
	title           = 'soil heat flux at 8cm depth'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_4_1_1'
	Evaluate        = 'G_4_1_1 = G_4_1_1;'
	title           = 'soil heat flux at 8cm depth'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_1'
	Evaluate        = 'G_1 = mean([G_1_1_1, G_2_1_1, G_3_1_1, G_4_1_1],2,"omitnan");'
	title           = 'soil heat flux averaged at 8 cm depth'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'SW_IN_1_1_1'
	Evaluate        = 'SW_IN_1_1_1 = SW_IN_1_1_1;'
	title           = 'incoming shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'SW_OUT_1_1_1'
	Evaluate        = 'SW_OUT_1_1_1 = SW_OUT_1_1_1;'
	title           = 'reflected shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'LW_IN_1_1_1'
	Evaluate        = 'LW_IN_1_1_1 = LW_IN_1_1_1;'
	title           = 'incoming long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'LW_OUT_1_1_1'
	Evaluate        = 'LW_OUT_1_1_1 = LW_OUT_1_1_1;'
	title           = 'outgoing long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'RG_1_1_1'
	Evaluate        = 'RG_1_1_1 = SW_IN_1_1_1+LW_IN_1_1_1;'
	title           = 'Global Radiation - total incoming SW & LW'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'NETRAD_1_1_1'
	Evaluate        = 'NETRAD_1_1_1 = calcNetRad(SW_IN_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);'
	title           = 'net radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'ALB_1_1_1'
	Evaluate        = 'ALB_1_1_1 = calcAlb(SW_IN_1_1_1,SW_OUT_1_1_1);'
	title           = 'albedo by CNR4'
	units           = '%'
[End]

[Trace]
	variableName    = 'PPFD_IN_1_1_1'
	Evaluate        = 'PPFD_IN_1_1_1 = PPFD_IN_1_1_1;'
	title           = 'incoming PAR'
	units           = '\mu mol/m^2/s'
[End]

[Trace]
	variableName    = 'PPFD_OUT_1_1_1'
	Evaluate        = 'PPFD_OUT_1_1_1 = PPFD_OUT_1_1_1;'
	title           = 'reflected PAR'
	units           = '\mu mol/m^2/s'
[End]

% non-gapfilled PA
[Trace]
	variableName    = 'PA_1_1_1'
	Evaluate        = 'PA_1_1_1 = PA_1_1_1;'
	title           = 'air pressure by CS106 installed in the logger box'
	units           = 'kPa' 
[End]

% gap-filled PA
[Trace]
	variableName    = 'PA_F_1_1_1'
	Evaluate        = 'PA_F_1_1_1 = gapFillUsingAltSensor(PA_1_1_1,PA_ECCC,[],[],1,"PA_F_1_1_1");'
	title           = 'air pressure by CS106 installed in the logger box'
	units           = 'kPa' 
[End]

% non gapfilled P_RAIN
[Trace]
	variableName    = 'P_RAIN_1_1_1'
	Evaluate        = 'P_RAIN_1_1_1 = P_RAIN_1_1_1;'
	title           = 'precipitation at 1.5m height'
	units           = 'mm' 
[End]

% P_RAIN and P_ECCC are different variables (rain only and precip, respectively)
% Should not use one to fill the other.
%[Trace]
%	variableName    = 'P_RAIN_1_1_1'
%	Evaluate        = 'P_RAIN_1_1_1 = calc_avg_trace(clean_tv,P_RAIN_1_1_1,P_ECCC,-1);'
%	title           = 'precipitation at 1.5m height'
%	units           = 'mm' 
%[End]

% Pass through P_ECCC as P_1_1_1?

[Trace]
	variableName    = 'DO_1_1_1'
	Evaluate        = 'DO_1_1_1 = DO_1_1_1;'
	title           = 'dissolved oxygen'
	units           = 'mg/l'
[End]

[Trace]
	variableName    = 'DOperc_1_1_1'
	Evaluate        = 'DOperc_1_1_1 = DOperc_1_1_1;'
	title           = 'dissolved oxygen ratio'
	units           = '% saturation'
[End]

[Trace]
	variableName    = 'COND_WATER_1_1_1'
	Evaluate        = 'COND_WATER_1_1_1 = COND_WATER_1_1_1;'
	title           = 'conductivity of water'
	units           = 'microS/cm'
[End]

% I think this was copy/pasted from another site, quite specific calculation. Commenting out for now (Rosie, 23 Sept 2026)
%[Trace]
%	variableName    = 'Salinity'
