%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Second stage ini_file for UQAM_2
%
% Apr 12, 2025 Zoran Nesic
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% Revisions:
%
% September 23, 2026 (David Trejo)
%   - WTD_1_1_1: companion to the first-stage water table fix.  The Evaluate is
%     unchanged - the trace arrives from first stage already converted and on the
%     right sign - but the title now states the convention, because "water table
%     depth" on its own is what let a sign question go unsettled for a season.
%     AMERIFLUX CONVENTION: positive = above the surface, negative = below it
%     (https://ameriflux.lbl.gov/data/measurement-height/).
%     First stage reads Lvl_psi_Avg and applies
%     currentCalibration = [0.70307 -<sensor_depth_below_surface> <start> ...].
%     This site: sensor 2.05 m below the peat surface (measured at installation).
%   - Not done here, but worth adding: the CS456 record carries isolated
%     half-hour spikes, always downward and nearly always around midday, which
%     look like someone at the well.  They sit inside minMax so first stage does
%     not catch them.  A 3-hour running-median filter removes them cleanly
%     (5 points in the 2026 record at this site).

%
% August 21, 2026 (David Trejo) 
%   - The file header said 'Second stage ini_file for UQAM_3'.  Fixed.
%   - Companion to the first-stage soil-heat-flux fix.  No change is needed
%     here for the calibration itself: G_1_1_1..G_4_1_1 arrive from first
%     stage already corrected, so G_1 (their mean) picks the fix up for free.
%     Per-plate corrections are +2.17, +2.09, -2.44 and -1.72 %, and they very
%     nearly cancel in the mean - G_1 shifts by ~0.02 %.  Do not expect G_1 to
%     move much when testing, the change is in the spread between the four pits.
%   - Added pass-through traces for the four individual plates
%	  Ameriflux wants the individual plates as
%     well as an aggregate, and it makes the per-plate correction visible
%     instead of hidden inside the mean.
%   - Added pass-throughs for the Soil-3 profile (SWC_1_1_1..SWC_1_4_1) and
%     D_SNOW, which exist in first stage but had no second-stage trace, so
%     they were not reaching third stage / Ameriflux.
%   - Added SWC_2_1_1..SWC_5_1_1 and TS_2_1_1..TS_5_1_1 for the four
%     single-depth CS650 at Soil-1, Soil-2, Soil-4 and Soil-5, new in
%     UQAM_2_FirstStage_test.ini.
%   - Corrected the profile depth labels: the deepest CS650 at UQAM_2 is at
%     45 cm, not 64 cm.  The 64 cm figure was copied from UQAM_1.  This
%     affects the TS_4 title here as well as the first-stage traces.
%   - WTD_1_1_1 keeps its name but now arrives from the CS456 pressure
%     transducer instead of the EasyProbe level channel.
%   - Fixed two units: G_1 was
%     labelled 'oC' when it is a heat flux, and TW_1_1_1
%   - Noticed but not changed: USTAR is defined twice in this file (identical
%     pass-through blocks).  Harmless, but one of them can go.
%   - Height of HygroVue10s modified accordingly.
%
% May 11, 2026 Karolina
%   -  Edited gap filled variables to have correct Ameriflux formatting (e.g. TA_F_1_1_1 instead of TA_1_1_1_F). 
%   -  See bottom of webpage: https://ameriflux.lbl.gov/data/aboutdata/data-variables/
%
% March 25, 2026 Umair
% 
% 	- Changed notation to be "Ameriflux-friendly": provide both non-gap-filled and gap-filled variables for AMF, 
% 	  as well as gap-filled '_F' for internal/data sharing.
%	- Switched height order for TA and RH, since Ameriflux requires upper-most air measurements to be e.g. TA_1_1_1, 
%     then second highest TA_1_2_1, etc. These were the other way round in earlier versions of the file. 

%% Recheck with Rosie: 
% 	- RH from ECCC is a good fit so we gapfilled the RH_1_1_1_F and RH_1_2_1_F traces using RH_ECCC. @Rosie: double 
%     check the data for future RH. 
%   - @Rosie: G_1: Check with David to confirm about taking average for four G_*_*_* variables at different horizontal locations. 
%     And are they at same vertical depth? and which depth are they?
%   - For P_RAIN_1_1_1 and P_ECCC, the variables are different with low r^2 and apprximately same number 
%     of missing values, so we did't use P_ECCC for gapfilling P_RAIN_1_1_1. 
%     So, I removed the P_RAIN_1_1_1_F trace.
%
%   - For (WS_1_1_1, WD_1_1_1) and (WS_ECCC, WD_ECCC), the variables are different and we can't use *_ECCC for gapfilling WS/WD_1_1_1. 
%     Becasue its not a good fit.
%     So, I comment out the WS/WD_1_1_1_F trace. There is no missing data for both these variables for 2025 and it can be tested with ERA-5 
%     later, if needed.
%   - @Rosie: Please review the wind_speed and wind_dir from Flux. 
%   - Wind direction filtering (badWD) moved to third stage (this happened some time ago).


Site_name = 'Natural Open Bog'
SiteID = 'UQAM_2'
input_path    = ''
output_path   = '' 
high_level_path = {}
searchPath = 'auto'
 
% Contents:
% Misc. variables
% Profiles
% Radiation
% Soil
% Turbulent fluxes
% Carbon balance terms
% Energy storage terms


% ----------------------------------------------------------------------------
% Misc. important variables - temperature, pressure etc.
% ----------------------------------------------------------------------------

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'TA_1_1_1'
	Evaluate        = 'TA_1_1_1 = TA_1_1_1;'
	title           = 'Air temperature at 5m (HMP)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_1_2_1'
	Evaluate        = 'TA_1_2_1 = TA_1_2_1;'
	title           = 'Air temperature at 2m (HMP)'
	units           = '^oC'
[End]

% gap-filled TA
[Trace]
	variableName    = 'TA_F_1_1_1'
    Evaluate        = 'TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_ECCC,[],[],[],"TA_F_1_1_1");'
	title           = 'Air temperature at 5m (HMP) gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_F_1_2_1'
    Evaluate        = 'TA_F_1_2_1 = gapFillUsingAltSensor(TA_1_2_1,TA_ECCC,[],[],[],"TA_F_1_2_1");'
	title           = 'Air temperature at 2m (HMP) gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'RH_1_1_1'
    Evaluate        = 'RH_1_1_1 = RH_1_1_1;'
	title           = 'RH at 5m (HMP)'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_1_2_1'
    Evaluate        = 'RH_1_2_1 = RH_1_2_1;'
	title           = 'RH at 2m (HMP)'
	units           = '%'
[End]

% gap-filled RH
[Trace]
	variableName    = 'RH_F_1_1_1'
    Evaluate        =  'qaqcIn=[]; 
                        qaqcIn.polyfitWithoutClamped = 2;
                        qaqcIn.clamped_minMax = [0,100];
                        qaqcIn.r2min = 0.93;        % default is 0.95, determined 0.93 is justified after testing
                        [RH_F_1_1_1, qaqcOut] = gapFillUsingAltSensor(RH_1_1_1,RH_ECCC,[],qaqcIn,1,"RH_F_1_1_1 with ECCC");'
	title           = 'RH at 5m (HMP) gap-filled using ECCC climate station data'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_F_1_2_1'
    Evaluate        =  'qaqcIn=[]; 
                        qaqcIn.polyfitWithoutClamped = 2;
                        qaqcIn.clamped_minMax = [0,100];
                        qaqcIn.r2min = 0.91;        % default is 0.95, determined 0.91 is justified after testing
                        [RH_F_1_2_1, qaqcOut] = gapFillUsingAltSensor(RH_1_2_1,RH_ECCC,[],qaqcIn,1,"RH_F_1_2_1 with ECCC");'
	title           = 'RH at 2m (HMP) gap-filled using ECCC climate station data'
	units           = '%'
[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName    = 'VPD_1_1_1'
    Evaluate        = 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 5m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_1_2_1'
    Evaluate        = 'VPD_1_2_1 = vapPressDeficit(TA_1_2_1,RH_1_2_1);'
	title           = 'Vapour pressure deficit (from 2m HMP)'
	units           = 'hPa'
[End]

% gap-filled VPD
[Trace]
	variableName    = 'VPD_F_1_1_1'
    Evaluate        = 'VPD_F_1_1_1 = vapPressDeficit(TA_F_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 5m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_F_1_2_1'
    Evaluate        = 'VPD_F_1_2_1 = vapPressDeficit(TA_F_1_2_1,RH_1_2_1);'
	title           = 'Vapour pressure deficit (from 2m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'TS_1'
	Evaluate        = 'TS_1 = TS_1_1_1;'
	title           = 'soil temperature at 8cm depth (Soil-3 profile)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_2'
	Evaluate        = 'TS_2 = TS_1_2_1;'
	title           = 'soil temperature at 16cm depth (Soil-3 profile)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_3'
	Evaluate        = 'TS_3 = TS_1_3_1;'
	title           = 'soil temperature at 32cm depth (Soil-3 profile)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_4'
	Evaluate        = 'TS_4 = TS_1_4_1;'
	title           = 'soil temperature at 45cm depth (Soil-3 profile)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'G_1'
	Evaluate        = 'G_1 = mean([G_1_1_1, G_2_1_1, G_3_1_1, G_4_1_1],2,"omitnan");'
	title           = 'soil heat flux at 5cm depth'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_1_1_1'
	Evaluate        = 'G_1_1_1 = G_1_1_1;'
	title           = 'soil heat flux at 8cm - Soil-1 (HFP01 SN 23102, mux 2H/2L)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_2_1_1'
	Evaluate        = 'G_2_1_1 = G_2_1_1;'
	title           = 'soil heat flux at 8cm - Soil-2 (HFP01 SN 23099, mux 4H/4L)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_3_1_1'
	Evaluate        = 'G_3_1_1 = G_3_1_1;'
	title           = 'soil heat flux at 8cm - Soil-4 (HFP01 SN 23100, mux 6H/6L)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_4_1_1'
	Evaluate        = 'G_4_1_1 = G_4_1_1;'
	title           = 'soil heat flux at 8cm - Soil-5 (HFP01 SN 23101, mux 8H/8L)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'SWC_1_1_1'
	Evaluate        = 'SWC_1_1_1 = SWC_1_1_1;'
	title           = 'soil water content at 8cm (Soil-3 profile)'
	units           = '%'
[End]

[Trace]
	variableName    = 'SWC_1_2_1'
	Evaluate        = 'SWC_1_2_1 = SWC_1_2_1;'
	title           = 'soil water content at 16cm (Soil-3 profile)'
	units           = '%'
[End]

[Trace]
	variableName    = 'SWC_1_3_1'
	Evaluate        = 'SWC_1_3_1 = SWC_1_3_1;'
	title           = 'soil water content at 32cm (Soil-3 profile)'
	units           = '%'
[End]

[Trace]
	variableName    = 'SWC_1_4_1'
	Evaluate        = 'SWC_1_4_1 = SWC_1_4_1;'
	title           = 'soil water content at 45cm (Soil-3 profile)'
	units           = '%'
[End]

[Trace]
	variableName    = 'SWC_2_1_1'
	Evaluate        = 'SWC_2_1_1 = SWC_2_1_1;'
	title           = 'soil water content at 8cm - Soil-1'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_2_1_1'
	Evaluate        = 'TS_2_1_1 = TS_2_1_1;'
	title           = 'soil temperature at 8cm - Soil-1'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'SWC_3_1_1'
	Evaluate        = 'SWC_3_1_1 = SWC_3_1_1;'
	title           = 'soil water content at 8cm - Soil-2'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_3_1_1'
	Evaluate        = 'TS_3_1_1 = TS_3_1_1;'
	title           = 'soil temperature at 8cm - Soil-2'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'SWC_4_1_1'
	Evaluate        = 'SWC_4_1_1 = SWC_4_1_1;'
	title           = 'soil water content at 8cm - Soil-4'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_4_1_1'
	Evaluate        = 'TS_4_1_1 = TS_4_1_1;'
	title           = 'soil temperature at 8cm - Soil-4'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'SWC_5_1_1'
	Evaluate        = 'SWC_5_1_1 = SWC_5_1_1;'
	title           = 'soil water content at 8cm - Soil-5'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_5_1_1'
	Evaluate        = 'TS_5_1_1 = TS_5_1_1;'
	title           = 'soil temperature at 8cm - Soil-5'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'D_SNOW'
	Evaluate        = 'D_SNOW = D_SNOW;'
	title           = 'snow depth (SnowVUE10)'
	units           = 'cm'
[End]

[Trace]
	variableName    = 'SW_IN_1_1_1'
	Evaluate        = 'SW_IN_1_1_1 = SW_IN_1_1_1;'
	title           = 'incoming shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'SW_OUT_1_1_1'
	Evaluate        = 'SW_OUT_1_1_1 = SW_OUT_1_1_1;'
	title           = 'reflected shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'LW_IN_1_1_1'
	Evaluate        = 'LW_IN_1_1_1 = LW_IN_1_1_1;'
	title           = 'incoming long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'LW_OUT_1_1_1'
	Evaluate        = 'LW_OUT_1_1_1 = LW_OUT_1_1_1;'
	title           = 'outgoing long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'RG_1_1_1'
	Evaluate        = 'RG_1_1_1 = SW_IN_1_1_1+LW_IN_1_1_1;'
	title           = 'Global Radiation - total incoming SW & LW'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'NETRAD_1_1_1'
    Evaluate        = 'NETRAD_1_1_1 = calcNetRad(SW_IN_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);'
	title           = 'net radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'ALB_1_1_1'
    Evaluate        = 'ALB_1_1_1 = calcAlb(SW_IN_1_1_1,SW_OUT_1_1_1);'
	title           = 'albedo by CNR4'
	units           = '%'
[End]

[Trace]
	variableName    = 'PPFD_IN_1_1_1'
	Evaluate        = 'PPFD_IN_1_1_1 = PPFD_IN_1_1_1;'
	title           = 'incoming PAR'
	units           = '\mu mol/m^2/s'
[End]

[Trace]
	variableName    = 'PPFD_OUT_1_1_1'
	Evaluate        = 'PPFD_OUT_1_1_1 = PPFD_OUT_1_1_1;'
	title           = 'reflected PAR'
	units           = '\mu mol/m^2/s'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'PA_1_1_1'
	Evaluate        = 'PA_1_1_1 = PA_1_1_1;'
	title           = 'air pressure by CS106 installed in the logger box'
	units           = 'kPa'
[End]

% gap-filled PA
[Trace]
	variableName    = 'PA_F_1_1_1'
    Evaluate        = 'PA_F_1_1_1 = gapFillUsingAltSensor(PA_1_1_1,PA_ECCC,[],[], [],"PA_F_1_1_1");'
	title           = 'air pressure by CS106 installed in the logger box, gap-filled using ECCC climate station data'
	units           = 'kPa' 
[End]


% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'P_RAIN_1_1_1'
	Evaluate        = 'P_RAIN_1_1_1 = P_RAIN_1_1_1;'
	title           = 'precipitation at 1.5m height'
	units           = 'mm'
[End]

% gap-filled P_RAIN
% No suitable alternative data.

[Trace]
	variableName    = 'DO_1_1_1'
	Evaluate        = 'DO_1_1_1 = DO_1_1_1;'
	title           = 'dissolved oxygen'
	units           = 'mg/l'
[End]

[Trace]
	variableName    = 'DOperc_1_1_1'
	Evaluate        = 'DOperc_1_1_1 = DOperc_1_1_1;'
	title           = 'dissolved oxygen ratio'
	units           = '% saturation'
[End]

[Trace]
	variableName    = 'COND_WATER_1_1_1'
	Evaluate        = 'COND_WATER_1_1_1 = COND_WATER_1_1_1;'
	title           = 'conductivity of water'
	units           = 'microS/cm'
[End]

[Trace]
	variableName    = 'Salinity'
	Evaluate        = 'Salinity = ((COND_WATER_1_1_1/1000).^1.0878).*0.4665; % unit: g/L, ppt;'
	title           = 'Salinity'
	units           = 'ppt'
[End]

% CHANGED 2026-09-23: AmeriFlux sign, + = above the surface.  Arrives from first
% stage as Lvl_psi_Avg with the datum applied there (sensor 2.05 m below the peat surface.)
[Trace]
	variableName    = 'WTD_1_1_1'
	Evaluate        = 'WTD_1_1_1 = WTD_1_1_1;'
	title           = 'water table depth - CS456 (+ = above surface)'
	units           = 'm'
[End]

[Trace]
	variableName    = 'ORP_1_1_1'
	Evaluate        = 'ORP_1_1_1 = ORP_1_1_1;'
	title           = 'oxygen reduction potential'
	units           = 'mV'
[End]

[Trace]
	variableName    = 'pH_1_1_1'
	Evaluate        = 'pH_1_1_1 = pH_1_1_1;'
	title           = 'water pH'
	units           = 'unitless'
[End]

[Trace]
	variableName    = 'TW_1_1_1'
	Evaluate        = 'TW_1_1_1 = TW_1_1_1;'
	title           = 'water temperature'
	units           = '^oC'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'WS_1_1_1'
	Evaluate        = 'WS_1_1_1 = WS_1_1_1;'
	title           = 'wind speed by RM Young 05103'
	units           = 'm/s'
[End]

% gap-filled WS
%[Trace]
%	variableName    = 'WS_1_1_1_F'
%    Evaluate        = 'WS_1_1_1_F = gapFillUsingAltSensor(WS_1_1_1,WS_ECCC, [], [], 1, "WS_1_1_1_F");'
%	title           = 'wind speed by RM Young 05103 gap-filled using ECCC climate station data'
%	units           = 'm/s' 
%[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'WD_1_1_1'
	Evaluate        = 'WD_1_1_1 = WD_1_1_1;'
	title           = 'wind direction by RM Young 05103'
	units           = 'degrees'
[End]

% gap-filled WD
% don't try to calibrate WD using avg_period = -1. Use avg_period = 0!
%[Trace]
%	variableName    = 'WD_1_1_1_F'
%    Evaluate        = 'WD_1_1_1_F = gapFillUsingAltSensor(WD_1_1_1,WD_ECCC,[],[],1, "WD_1_1_1_F");'
%	title           = 'wind direction by RM Young 05103 gap-filled using ECCC climate station data'
%	units           = 'degrees' 
