%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Second stage ini_file for MCGILL_1
%
% Apr 12, 2025 Zoran Nesic
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% Revisions:
%
% September 29, 2026 (David Trejo)
%   - TW_1_5_1: pass-through of the renamed deepest water thermocouple (logged as
%     TW_5_1_1 until 2026-09-28 11:30; first stage joins the two names).
%
% September 23, 2026 (David Trejo)
%   - WTD_1_1_1: companion to the first-stage water table fix.  The Evaluate is
%     unchanged - the trace arrives from first stage already converted and on the
%     right sign - but the title now states the convention, because "water table
%     depth" on its own is what let a sign question go unsettled for a season.
%     AMERIFLUX CONVENTION: positive = above the surface, negative = below it
%     (https://ameriflux.lbl.gov/data/measurement-height/).
%     First stage reads Lvl_psi_Avg and applies
%     currentCalibration = [0.70307 -<sensor_depth_below_surface> <start> ...].
%     This site: open water. The CS456 is a stage sensor over the lake bed, so the
%     depth is negative (-0.16 m, sensor above the bed) and the value is positive
%     all season by construction. Check the Ameriflux BASE name before upload:
%     WTD is water table depth, this is surface-water stage.
%   - Not done here, but worth adding: the CS456 record carries isolated
%     half-hour spikes, always downward and nearly always around midday, which
%     look like someone at the well.  They sit inside minMax so first stage does
%     not catch them.  A 3-hour running-median filter removes them cleanly
%     (0 points in the 2026 record at this site).
% 
% Aug 6, 2026 Rosie
%	- Removed RH_F_1_1_1 and RH_F_1_2_1 traces fully (commented out for now), given there is no suitable data for gap-filling.
%
% May 11, 2026 Karolina
%   -  Edited gap filled variables to have correct Ameriflux formatting (e.g. TA_F_1_1_1 instead of TA_1_1_1_F). 
%   -  See bottom of webpage: https://ameriflux.lbl.gov/data/aboutdata/data-variables/
%
% March 25, 2026 Umair
% 
% 	- Changed notation to be "Ameriflux-friendly": provide both non-gap-filled and gap-filled variables for AMF, 
% 	  as well as gap-filled '_F' for internal/data sharing.
%	- Switched height order for TA and RH, since Ameriflux requires upper-most air measurements to be e.g. TA_1_1_1, 
%     then second highest TA_1_2_1, etc. These were the other way round in earlier versions of the file. 

%% Recheck with Rosie and rewrite: 
% 	- RH from ECCC is not a good fit so we removed the RH_1_1_1_F and RH_1_2_1_F traces.
%   - @Rosie: G_1: Check with David to confirm about taking average for four G_*_*_* variables at different horizontal locations. 
%     And are they at same vertical depth? and which depth are they?
%   - For P_RAIN_1_1_1 and P_ECCC, the variables are different and we can't use P_ECCC for gapfilling P_RAIN_1_1_1. 
%     So, I removed the P_RAIN_1_1_1_F trace.
%   - For (WS_1_1_1, WD_1_1_1) and (WS_ECCC, WD_ECCC), the variables are different and we can't use *_ECCC for gapfilling WS/WD_1_1_1. 
%     Becasue its not a good fit.
%     So, I comment out the WS/WD_1_1_1_F trace. There is no missing data for both these variables for 2025 and it can be tested with ERA-5 
%     later, if needed.
%   - @Rosie: Please review the wind_speed and wind_dir from Flux. 
%   - Wind direction filtering (badWD) moved to third stage (this happened some time ago).

Site_name = 'MCGILL_1'
SiteID = 'MCGILL_1'
input_path    = ''
output_path   = '' 
high_level_path = {}
searchPath = 'auto'
 
% Contents:
% Misc. variables
% Profiles
% Radiation
% Soil
% Turbulent fluxes
% Carbon balance terms
% Energy storage terms

[Trace]
	variableName 	= 'all_nan'
	Evaluate 		= 'all_nan = nan(size(clean_tv));
                		processingYear = yearIn;'
	title 			= 'definitions of a all_nan trace and some global variables'
	units 			= ''
[End]

% ----------------------------------------------------------------------------
% Misc. important variables - temperature, pressure etc.
% ----------------------------------------------------------------------------

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'TA_1_1_1'
	Evaluate        = 'TA_1_1_1 = TA_1_1_1;'
	title           = 'Air temperature at 7m (HMP)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_1_2_1'
	Evaluate        = 'TA_1_2_1 = TA_1_2_1;'
	title           = 'Air temperature at 2m (HMP)'
	units           = '^oC'
[End]

% gap-filled TA
[Trace]
	variableName    = 'TA_F_1_1_1'
    Evaluate        = 'TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_ECCC,[],[],[],"TA_F_1_1_1");'
	title           = 'Air temperature at 7m (HMP) gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_F_1_2_1'
    Evaluate        = 'TA_F_1_2_1 = gapFillUsingAltSensor(TA_1_2_1,TA_ECCC,[],[],[],"TA_F_1_2_1");'
	title           = 'Air temperature at 2m (HMP) gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'RH_1_1_1'
    Evaluate        = 'RH_1_1_1 = RH_1_1_1;'
	title           = 'RH at 7m (HMP)'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_1_2_1'
    Evaluate        = 'RH_1_2_1 = RH_1_2_1;'
	title           = 'RH at 2m (HMP)'
	units           = '%'
[End]

% gap-filled RH
% No suitable data is present to gapfill.
%[Trace]
%	variableName    = 'RH_F_1_1_1'
%    Evaluate        =  'RH_F_1_1_1=RH_1_1_1;'
%	title           = 'RH at 7m (HMP) gap-filled using ECCC climate station data'
%	units           = '%'
%[End]

%[Trace]
%	variableName    = 'RH_F_1_2_1'
%    Evaluate        =  'RH_F_1_2_1 = RH_1_2_1;'
%    title           = 'RH at 2m (HMP) gap-filled using ECCC climate station data'
%	units           = '%'
%[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName    = 'VPD_1_1_1'
    Evaluate        = 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 7m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_1_2_1'
    Evaluate        = 'VPD_1_2_1 = vapPressDeficit(TA_1_2_1,RH_1_2_1);'
	title           = 'Vapour pressure deficit (from 2m HMP)'
	units           = 'hPa'
[End]

% gap-filled VPD
[Trace]
	variableName    = 'VPD_F_1_1_1'
    Evaluate        = 'VPD_F_1_1_1 = vapPressDeficit(TA_F_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 7m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_F_1_2_1'
    Evaluate        = 'VPD_F_1_2_1 = vapPressDeficit(TA_F_1_2_1,RH_1_2_1);'
	title           = 'Vapour pressure deficit (from 2m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'TS_1'
	Evaluate        = 'TS_1 = TS_1_1_1;'
	title           = 'average soil temperature at 8cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_2'
	Evaluate        = 'TS_2 = TS_1_2_1;'
	title           = 'average soil temperature at 16cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_3'
	Evaluate        = 'TS_3 = TS_1_3_1;'
	title           = 'average soil temperature at 32cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_4'
	Evaluate        = 'TS_4 = TS_1_4_1;'
	title           = 'average soil temperature at 64cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'G_1'
	Evaluate        = 'if(processingYear<2026),
						G_1 = mean([G_1_1_1, G_2_1_1, G_3_1_1, G_4_1_1],2,"omitnan");
					   else
					    G_1 = all_nan;
					   end;'
	title           = 'soil heat flux at 5cm depth'
	units           = '∞C'
[End]

[Trace]
	variableName    = 'SW_IN_1_1_1'
	Evaluate        = 'SW_IN_1_1_1 = SW_IN_1_1_1;'
	title           = 'incoming shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'SW_OUT_1_1_1'
	Evaluate        = 'SW_OUT_1_1_1 = SW_OUT_1_1_1;'
	title           = 'reflected shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'LW_IN_1_1_1'
	Evaluate        = 'LW_IN_1_1_1 = LW_IN_1_1_1;'
	title           = 'incoming long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'LW_OUT_1_1_1'
	Evaluate        = 'LW_OUT_1_1_1 = LW_OUT_1_1_1;'
	title           = 'outgoing long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'RG_1_1_1'
	Evaluate        = 'RG_1_1_1 = SW_IN_1_1_1+LW_IN_1_1_1;'
	title           = 'Global Radiation - total incoming SW & LW'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'NETRAD_1_1_1'
    Evaluate        = 'NETRAD_1_1_1 = calcNetRad(SW_IN_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);'
	title           = 'net radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'ALB_1_1_1'
    Evaluate        = 'ALB_1_1_1 = calcAlb(SW_IN_1_1_1,SW_OUT_1_1_1);'
	title           = 'albedo by CNR4'
	units           = '%'
[End]

[Trace]
	variableName    = 'PPFD_IN_1_1_1'
	Evaluate        = 'PPFD_IN_1_1_1 = PPFD_IN_1_1_1;'
	title           = 'incoming PAR'
	units           = '\mu mol/m^2/s'
[End]

[Trace]
	variableName    = 'PPFD_OUT_1_1_1'
	Evaluate        = 'PPFD_OUT_1_1_1 = PPFD_OUT_1_1_1;'
	title           = 'reflected PAR'
	units           = '\mu mol/m^2/s'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'PA_1_1_1'
	Evaluate        = 'PA_1_1_1 = PA_1_1_1;'
	title           = 'air pressure by CS106 installed in the logger box'
	units           = 'kPa'
[End]

% gap-filled PA
[Trace]
	variableName    = 'PA_F_1_1_1'
    Evaluate        = 'PA_F_1_1_1 = gapFillUsingAltSensor(PA_1_1_1,PA_ECCC,[],[], [],"PA_F_1_1_1");'
	title           = 'air pressure by CS106 installed in the logger box, gap-filled using ECCC climate station data'
	units           = 'kPa' 
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'P_RAIN_1_1_1'
	Evaluate        = 'P_RAIN_1_1_1 = P_RAIN_1_1_1;'
	title           = 'precipitation at 1.5m height'
	units           = 'mm'
[End]

% gap-filled P_RAIN
% No suitable data is present to gapfill.

[Trace]
	variableName    = 'DO_1_1_1'
	Evaluate        = 'DO_1_1_1 = DO_1_1_1;'
	title           = 'dissolved oxygen'
	units           = 'mg/l'
[End]

[Trace]
	variableName    = 'DOperc_1_1_1'
	Evaluate        = 'DOperc_1_1_1 = DOperc_1_1_1;'
	title           = 'dissolved oxygen ratio'
	units           = '% saturation'
[End]

[Trace]
	variableName    = 'COND_WATER_1_1_1'
	Evaluate        = 'COND_WATER_1_1_1 = COND_WATER_1_1_1;'
	title           = 'conductivity of water'
	units           = 'microS/cm'
[End]

[Trace]
	variableName    = 'Salinity'
	Evaluate        = 'Salinity = ((COND_WATER_1_1_1/1000).^1.0878).*0.4665; % unit: g/L, ppt;'
	title           = 'Salinity'
	units           = 'ppt'
[End]

% CHANGED 2026-09-23: AmeriFlux sign, + = above the surface.  Arrives from first
% stage as Lvl_psi_Avg with the datum applied there. Open water: stage over the lake
% bed, sensor 0.16 m above it, so the sensor depth is negative.
[Trace]
	variableName    = 'WTD_1_1_1'
	Evaluate        = 'WTD_1_1_1 = WTD_1_1_1;'
	title           = 'water level over the lake bed - CS456 (+ = above the bed)'
	units           = 'm'
[End]

[Trace]
	variableName    = 'ORP_1_1_1'
	Evaluate        = 'ORP_1_1_1 = ORP_1_1_1;'
	title           = 'oxygen reduction potential'
	units           = 'mV'
[End]

[Trace]
	variableName    = 'pH_1_1_1'
	Evaluate        = 'pH_1_1_1 = pH_1_1_1;'
	title           = 'water pH'
	units           = 'unitless'
[End]

[Trace]
	variableName    = 'TW_1_1_1'
	Evaluate        = 'TW_1_1_1 = TW_1_1_1;'
	title           = 'water temperature'
	units           = '∞C'
[End]

[Trace]
	variableName    = 'TW_1_5_1'
	Evaluate        = 'TW_1_5_1 = TW_1_5_1;'
	title           = 'water temperature 5cm above the bottom (thermocouple profile)'
	units           = '°C'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'WS_1_1_1'
	Evaluate        = 'WS_1_1_1 = WS_1_1_1;'
	title           = 'wind speed by RM Young 05103'
	units           = 'm/s'
[End]

% gap-filled WS
%[Trace]
%	variableName    = 'WS_1_1_1_F'
%    Evaluate        = 'WS_1_1_1_F = gapFillUsingAltSensor(WS_1_1_1,WS_ECCC, [], [], 1, "WS_1_1_1_F");'
%	title           = 'wind speed by RM Young 05103 gap-filled using ECCC climate station data'
%	units           = 'm/s' 
%[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'WD_1_1_1'
	Evaluate        = 'WD_1_1_1 = WD_1_1_1;'
	title           = 'wind direction by RM Young 05103'
	units           = 'degrees'
[End]

% gap-filled WD
% don't try to calibrate WD using avg_period = -1. Use avg_period = 0!
%[Trace]
%	variableName    = 'WD_1_1_1_F'
%    Evaluate        = 'WD_1_1_1_F = gapFillUsingAltSensor(WD_1_1_1,WD_ECCC,[],[],1, "WD_1_1_1_F");'
%	title           = 'wind direction by RM Young 05103 gap-filled using ECCC climate station data'
%	units           = 'degrees' 
%[End]

[Trace]
	variableName    = 'wind_speed'
   	Evaluate        = 'wind_speed = WS;'
	title           = 'Mean wind speed (CSAT3)'
	units           = 'm/s' 
[End]

[Trace]
	variableName    = 'wind_dir'
    Evaluate        = 'wind_dir = wind_dir;'
	%Evaluate        = 'wind_dir = calc_avg_trace(clean_tv,wind_dir,WD_ECCC,-1);'
    %Evaluate        = 'wind_dir = gapFillUsingAltSensor(wind_dir,WD_ECCC,[], [], 1, "wind_dir");'
	title           = 'Direction from which the wind blows, with respect to Geographic or Magnetic north'
	units           = 'm/s' 
[End]


% ----------------------------------------------------------------------------
% Turbulent fluxes LI-7200 & LI-7700
% ----------------------------------------------------------------------------

[Trace]
	variableName    = 'CO2'
	Evaluate        = 'CO2 = CO2;'
	title           = 'CO2 in mole fraction of wet air'
	units           = '\mu mol / mol wet air'
[End]

[Trace]
	variableName    = 'H2O'
	Evaluate        = 'H2O = H2O;'
	title           = 'H2O in mole fraction of wet air'
	units           = 'mm mol / mol wet air'
[End]

[Trace]
	variableName    = 'CH4'
	Evaluate        = 'CH4 = CH4;'
	title           = 'CH4 in mole fraction of wet air'
	units           = 'nmol / mol wet air'
[End]

[Trace]
	variableName    = 'USTAR'
	Evaluate        = 'USTAR = USTAR;'
	title           = 'Friction Velocity'
	units           = 'm/s'
[End]

[Trace]
	variableName    = 'w_ts_cov'
	Evaluate        = 'w_ts_cov = w_ts_cov;'
	title           = 'Covariance of w and sonic temperature (Sonic, after rotation)'
	units           = 'm/s degK'
[End]

[Trace]
	variableName    = 'w_h2o_cov'
	Evaluate        = 'w_h2o_cov=w_h2o_cov;'
	title           = 'Covariance of w and water vapour mixing ratio (after rotation)'
	units           = 'm/s mmol/mol'
[End]

[Trace]
	variableName    = 'w_co2_cov'
	Evaluate        = 'w_co2_cov=w_co2_cov;'
	title           = 'Covariance of w and CO2 (after rotation)'
	units           = 'm/s umol/mol'
[End]

[Trace]
	variableName    = 'w_ch4_cov'
	Evaluate        = 'w_ch4_cov=w_ch4_cov;'
	title           = 'Covariance of w and CH4 (after rotation)'
	units           = 'm/s nmol/mol'
[End]

[Trace]
	variableName    = 'LE'
	Evaluate        = 'LE=LE;'
	title           = 'Latent Heat Flux'
	units           = 'W m^{-2}'
[End]

[Trace]
	variableName    = 'SLE'
	Evaluate        = 'SLE=SLE;'
	title           = 'Estimate of storage latent heat flux'
	units           = 'W m^{-2}'
[End]

[Trace]
	variableName    = 'H'
	Evaluate        = 'H=H;'
	title           = 'sensible heat flux'
	units           = 'W m^{-2}'
[End]

[Trace]
	variableName    = 'SH'
	Evaluate        = 'SH=SH;'
	title           = 'Estimate of storage sensible heat flux'
	units           = 'W m^{-2}'
[End]

[Trace]
	variableName    = 'FC'
	Evaluate        = 'FC=FC;'
	title           = 'CO_2 Flux'
	units           = '\mu mol m^{-2} s^{-1}'
[End]

[Trace]
	variableName    = 'SC'
	Evaluate        = 'SC=SC;'
	title           = 'Estimate of storage CO2 flux'
	units           = 'umol/m^2/s'
[End]


[Trace]
	variableName    = 'FCH4'
	Evaluate        = 'FCH4=FCH4;'
	title           = 'CH_4 Flux'
	units           = 'nmol m^{-2} s^{-1}'
[End]

[Trace]
	variableName    = 'SCH4'
	Evaluate        = 'SCH4=SCH4;'
	title           = 'Estimate of storage CH4 flux'
	units           = 'nmol m^{-2} s^{-1}'
[End]

[Trace]
	variableName    = 'USTAR'
	Evaluate        = 'USTAR = USTAR;'
	title           = 'Friction Velocity'
	units           = 'm/s'
[End]

[Trace]
	variableName    = 'TKE'
	Evaluate        = 'TKE=TKE;'
	title           = 'Turbulent kinetic energy'
	units           = 'm2 s-2'
[End]

[Trace]
	variableName    = 'L'
	Evaluate        = 'L = L;'
	title           = 'Monin-Obukhov length'
	units           = 'm'
[End]

[Trace]
	variableName    = 'U_SIGMA'
	Evaluate        = 'U_SIGMA = sqrt(u_var);'
	title           = 'Standard deviation of velocity fluctuations'
	units           = 'm s-1'
[End]

[Trace]
	variableName    = 'V_SIGMA'
	Evaluate        = 'V_SIGMA = sqrt(v_var);'
	title           = 'Standard deviation of lateral velocity fluctuations'
	units           = 'm s-1'
[End]

[Trace]
	variableName    = 'W_SIGMA'
	Evaluate        = 'W_SIGMA = sqrt(w_var);'
	title           = 'Standard deviation of vertical velocity fluctuations'
	units           = 'm s-1'
[End]

[Trace]
	variableName    = 'TAU'
	Evaluate        = 'TAU=TAU;'
	title           = 'Corrected momentum flux'
	units           = 'kg m-1 s-2'
[End]

[Trace]
	variableName    = 'zdL'
	Evaluate        = 'zdL = zdL;'
	title           = 'Monin-Obukhov stability parameter. EddyPro output name: (z-d)/L'
	units           = 'dimensionless'
[End]

[Trace]
	variableName = 'T_SONIC'
	Evaluate = 'T_SONIC = T_SONIC;'
	title = 'Mean temperature of ambient air as measured by the anemometer'
	units = 'C'
	minMax = [-40,50]
[End]


% ----------------------------------------------------------------------------
% Misc Meteorological variables
% ----------------------------------------------------------------------------

[Trace]
	variableName    = 'aerodynamic_resistance_momentum'
	Evaluate        = '[ga_m_vel, ga_h_vel] = calc_aerodynamic_conductance(WS_1_1_1,USTAR,zdL);
                        aerodynamic_resistance_momentum = 1./ga_m_vel;'
	title           = 'Aerodynamic resistance for momentum'
	units           = 's m^{-1}'
[End]

[Trace]
	variableName    = 'aerodynamic_resistance_scalar'
	Evaluate        = '[ga_m_vel, ga_h_vel] = calc_aerodynamic_conductance(WS_1_1_1,USTAR,zdL);
                        aerodynamic_resistance_scalar = 1./ga_h_vel;'
	title           = 'Aerodynamic resistance for heat and water vapour'
	units           = 's m^{-1}'
[End]

[Trace]
	variableName    = 'surface_conductance'
	Evaluate        = 'available_energy = (NETRAD_1_1_1 - G_1); % could better estimate storage terms for G
                       surface_conductance = calc_surface_conductance_as_flx(TA_1_1_1,...
                        RH_1_1_1, aerodynamic_resistance_scalar, available_energy,...
                        LE, PA_1_1_1);'
	title           = 'Surface conductance'
	units           = 'mol m^{-2} s^{-1}'
[End]

% Revisit after Paul investigated ERA-5 data.
%[Trace]
%	variableName    = 'hpbl'
%	Evaluate        = 'hpbl = hpbl;'
%	title           = 'Estimated Height of Planetary Boundary Layer'
%	units           = 'm/s' 
%[End]
%
