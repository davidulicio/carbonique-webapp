name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check browser modules
        run: |
          for source in static/hub/app.js static/hub/resources.js static/hub/monitor.js static/hub/pdf-viewer.js static/hub/storage.js static/hub/sw.js; do
            node --check "$source"
          done
      - run: python -m pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test hub
