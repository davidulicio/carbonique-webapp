{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Field Notes · Carbonique</title>{% include "icons.html" %}<link rel="stylesheet" href="{% static 'hub/style.css' %}"><style>body{background:#f5f7f2}.reference-bar{height:66px;display:flex;justify-content:space-between;align-items:center;padding:0 25px;background:white;border-bottom:1px solid #e2e8df;gap:10px}.reference-brand{display:flex;align-items:center;gap:18px;color:#1d493b;font-size:12px}.reference-brand img{display:block;height:48px;width:auto}.reference-frame{display:block;width:100%;height:calc(100dvh - 66px);border:0;background:white}@media(max-width:600px){.reference-bar{padding:0 12px}.reference-brand span{display:none}.reference-brand img{height:43px}}body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}.reference-bar{height:auto;min-height:66px;flex-shrink:0;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}.reference-bar .row-actions{flex-wrap:wrap}.reference-frame{flex:1;min-height:0;height:auto}</style><link rel="stylesheet" href="{% static 'hub/resources.css' %}"></head><body><header class="reference-bar"><div class="reference-brand"><a href="/fieldnotes/"><img src="{% static 'hub/logo.svg' %}" alt="Carbonique"></a><span>Public field notes & site reference</span></div><div class="row-actions"><a class="button secondary small" href="/fieldnotes/">Refresh public site</a><a class="button secondary small" href="/fieldnotes/content/" target="_blank" rel="noopener">Open full page ↗</a><a class="button secondary small" href="/fieldnotes/download/">Download HTML</a><a class="button primary small" href="/">{% if user.is_authenticated %}Team workspace{% else %}Team sign in{% endif %}</a></div></header><iframe class="reference-frame" title="Carbonique public field notes, maintenance history and data caveats" sandbox="allow-scripts allow-popups allow-downloads" src="/fieldnotes/content/?revision={{ revision }}"></iframe></body></html>
