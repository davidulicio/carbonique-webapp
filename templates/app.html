{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#77633c"><meta name="csrf-token" content="{{ csrf_token }}"><title>Carbonique Hub</title>{% include "icons.html" %}<link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="{% static 'hub/style.css' %}"><link rel="stylesheet" href="{% static 'hub/resources.css' %}"></head>
<body><button id="navigation-backdrop" class="navigation-backdrop" aria-label="Close navigation" tabindex="-1" hidden></button><aside class="sidebar" id="workspace-navigation" aria-label="Workspace navigation"><button id="navigation-close" class="icon-button navigation-close" aria-label="Close navigation">×</button><a class="brand" href="/"><img src="{% static 'hub/logo.svg' %}" alt="Carbonique"><span>FIELD OPERATIONS</span></a><div class="nav-label">WORKSPACE</div><nav id="navigation" aria-label="Main navigation"></nav><div class="sidebar-bottom"><div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-label">Connecting…</span></div><button class="quiet full" id="queue-button">Sync queue · <span id="queue-count">0</span><span id="queue-status"></span></button><button class="quiet full" id="logout-button">Sign out & clear this device</button><p class="small muted">Wetland carbon research<br>Québec · Canada</p></div></aside>
<div class="workspace"><header class="topbar"><button class="icon-button mobile-menu" id="mobile-menu" aria-label="Open navigation" aria-controls="workspace-navigation" aria-expanded="false">☰</button><label class="site-picker">SITE <select id="site-select" aria-label="Select site"><option>Loading sites…</option></select></label><div class="topbar-actions"><button id="prepare-button" class="button secondary" aria-label="Prepare for fieldwork" title="Prepare for fieldwork">Prepare for fieldwork</button><button id="refresh-button" class="icon-button" aria-label="Refresh data">↻</button><span id="user-badge" class="user-badge"></span></div></header><main id="main" tabindex="-1"><div class="empty">Loading your workspace…</div></main><footer class="page-footer">Carbonique Hub <span>Field observations → instrument history → scientific context</span></footer></div>
<dialog id="dialog" aria-labelledby="dialog-title"><form id="dialog-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" class="icon-button" aria-label="Close dialog">×</button></div><div id="dialog-body"></div><div id="dialog-error" class="error" hidden></div><div class="dialog-actions"><button type="button" id="dialog-cancel" class="button secondary">Cancel</button><button type="submit" id="dialog-save" class="button primary">Save</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script type="module" src="{% static 'hub/app.js' %}"></script></body></html>
